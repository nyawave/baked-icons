name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck

      - name: Build examples (Vite + Next.js Turbopack)
        run: pnpm build:examples

      - name: Build Next.js example with webpack
        run: pnpm --filter example-next-app build:webpack

      - name: Check publish contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        working-directory: packages/baked-icons
        run: npm pack --dry-run
