name: Release

# Publishes @nyawave/baked-icons to npm when a GitHub Release is published.
#
# Authentication uses npm "trusted publishing" (OIDC), so no NPM_TOKEN secret
# is needed. One-time setup on npmjs.com:
#   package settings -> Publishing access -> Trusted publisher -> GitHub Actions
#   organization: nyawave   repository: baked-icons   workflow: release.yml
# The very first version has to be published manually (see CONTRIBUTING.md),
# because the trusted-publisher form only exists for packages that already
# exist on the registry.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        working-directory: packages/baked-icons
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish
        working-directory: packages/baked-icons
        run: npm publish --provenance --access public
