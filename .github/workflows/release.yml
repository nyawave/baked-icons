name: Release

# Stages @nyawave/baked-icons on npm when a GitHub Release is published.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    name: Stage on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `npm stage` needs npm >= 11.15; make sure the runner has a recent CLI.
      - run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        working-directory: packages/baked-icons
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Stage publish
        working-directory: packages/baked-icons
        run: npm stage publish --provenance --access public

      - name: Next step
        run: |
          echo "::notice title=Approve on npm::The package is staged. Approve it at https://www.npmjs.com/package/@nyawave/baked-icons (Staged Packages) or run 'npm stage approve <id>'."
